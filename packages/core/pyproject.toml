[project]
name = "verdflow-core"
version = "0.1.0"
description = "Application use cases and persistent job runtime for VerdFlow."
requires-python = ">=3.11"
dependencies = [
  "ijson>=3.4.0.post0,<4",
  "verdflow-contracts",
  "verdflow-project-store",
  "verdflow-planting",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]
