[project]
name = "verdflow-planting"
version = "0.1.0"
description = "Strategy authoring and deterministic target asset assignment for VerdFlow."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22,<5",
  "PyYAML>=6.0,<7",
  "verdflow-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]

[tool.hatch.build.targets.wheel.force-include]
"src/verdflow/planting/schemas" = "verdflow/planting/schemas"
