<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="224" viewBox="0 0 1040 224" role="img" aria-labelledby="title desc"><title id="title">从影像识别绿地</title><desc id="desc">还没有绿地面？从 RGB 影像在本机识别植被，配合对齐的地形高程完成种植。 复核候选范围与边界；按需为裸岩、裸土留白；确认范围后生成种植点位。查看操作指南。</desc><rect x="0.5" y="0.5" width="1039" height="223" rx="6" fill="#fff" stroke="#dce5de"></rect><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" letter-spacing="0"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#527c4b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" x="28" y="24" class="lucide lucide-image-icon lucide-image"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg><text x="1012" y="44" fill="#a0ada2" font-size="13" font-weight="400" text-anchor="end">03</text><text x="78" y="44" fill="#6e8275" font-size="12" font-weight="600" text-anchor="start">RGB GEOTIFF + DEM</text><text x="28" y="94" fill="#243d31" font-size="28" font-weight="600" text-anchor="start">从影像识别绿地</text><text x="28" y="128" fill="#768279" font-size="16" font-weight="400" text-anchor="start">还没有绿地面？从 RGB 影像在本机识别植被，</text><text x="28" y="153" fill="#768279" font-size="16" font-weight="400" text-anchor="start">配合对齐的地形高程完成种植。</text><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#567365" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" x="655" y="75" class="lucide lucide-check-icon lucide-check"><path d="M20 6 9 17l-5-5"></path></svg><text x="682" y="88" fill="#567365" font-size="16" font-weight="400" text-anchor="start">复核候选范围与边界</text><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#567365" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" x="655" y="106" class="lucide lucide-check-icon lucide-check"><path d="M20 6 9 17l-5-5"></path></svg><text x="682" y="119" fill="#567365" font-size="16" font-weight="400" text-anchor="start">按需为裸岩、裸土留白</text><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#567365" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" x="655" y="137" class="lucide lucide-check-icon lucide-check"><path d="M20 6 9 17l-5-5"></path></svg><text x="682" y="150" fill="#567365" font-size="16" font-weight="400" text-anchor="start">确认范围后生成种植点位</text><line x1="28" y1="178" x2="1012" y2="178" stroke="#e7ede6"></line><text x="28" y="210" fill="#245d47" font-size="14" font-weight="400" text-anchor="start">查看操作指南</text><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#245d47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" x="991" y="194" class="lucide lucide-arrow-up-right-icon lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></g></svg>
