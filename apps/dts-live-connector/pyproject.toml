[project]
name = "verdflow-dts-live-connector"
version = "0.1.0"
description = "Authenticated loopback transport for DTS Explorer live sessions."
requires-python = ">=3.11"
dependencies = [
  "verdflow-dts-adapter",
  "verdflow-geospatial-worker",
  "verdflow-system-host",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]
