[project]
name = "verdflow-system-host"
version = "0.1.0"
description = "System-scoped VerdFlow host for the user library and active projects."
requires-python = ">=3.11"
dependencies = [
  "verdflow-asset-package",
  "verdflow-authoring-kits",
  "verdflow-blender-worker",
  "verdflow-contracts",
  "verdflow-core-host",
  "verdflow-dts-adapter",
  "verdflow-geospatial-worker",
  "verdflow-library-store",
  "verdflow-model-api",
  "verdflow-planting",
  "verdflow-profile-package",
  "verdflow-project-store",
  "verdflow-strategy-worker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]
