[project]
name = "verdflow-library-store"
version = "0.1.0"
description = "User-scoped strategy library and trust persistence for VerdFlow."
requires-python = ">=3.11"
dependencies = [
  "verdflow-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]
