[project]
name = "verdflow-authoring-kits"
version = "0.1.0"
description = "Portable Agent authoring kits for VerdFlow exchange formats."
requires-python = ">=3.11"
dependencies = ["verdflow-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]

[tool.hatch.build.targets.wheel.force-include]
"src/verdflow/authoring_kits/kits" = "verdflow/authoring_kits/kits"
