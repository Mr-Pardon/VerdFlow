[project]
name = "verdflow-cli"
version = "0.1.0"
description = "Command-line application entry for VerdFlow."
requires-python = ">=3.11"
dependencies = [
  "verdflow-contracts",
  "verdflow-core-host",
  "verdflow-geospatial-worker",
  "verdflow-library-store",
]

[project.scripts]
verdflow = "verdflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]
