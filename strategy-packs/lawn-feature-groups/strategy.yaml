    - id: feature
      name: 点景组团
      description: 中心主景、周边灌木与外围小型点缀。
      role_keys:
      - feature_anchor
      - surrounding_shrub
      - outer_accent
      diagram:
      - {role_key: lawn_groundcover, kind: area, points: [[4, 7], [96, 7], [96, 57], [4, 57]]}
