[project]
name = "verdflow-strategy-worker"
version = "0.1.0"
description = "Trusted-local strategy package inspector and subprocess runner for VerdFlow."
requires-python = ">=3.11"
dependencies = [
  "verdflow-contracts",
  "verdflow-core",
  "verdflow-planting",
  "verdflow-project-store",
  "verdflow-worker-runtime",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]
