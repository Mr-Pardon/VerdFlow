  role_presentation:
    version: '1'
    roles:
      lawn_groundcover:
        suggested_assets:
        - 草坪块
        - 低矮地被
        note: 草坪间距与素材缩放需要配合，实际覆盖效果由素材大小决定。
      edge_groundcover:
        suggested_assets:
        - 小型草坪块
        - 小型地被
        note: 可沿用主体草坪的素材，再单独调小缩放；此处点位间距为 0.5 米。
      feature_anchor:
        suggested_assets:
        - 乔木
        - 棕榈
        - 高大观赏植物
        note: 主景出现概率控制无主景组团的构图；关闭此用途仅移除主景点位，不重排周边植被。
      surrounding_shrub:
        suggested_assets:
        - 球形灌木
        - 矮灌木
        note: 每个完整组团通常包含 2 至 4 株，适合紧凑、小尺度的素材。
      outer_accent:
        suggested_assets:
        - 草花
        - 小型观赏草
        - 小型灌木
        note: 建议选择比组团灌木更小的素材，避免遮住主景层次。
    groups:
    - id: lawn
      name: 草坪覆盖
      description: 主体铺面，较小草坪收边。
      role_keys:
