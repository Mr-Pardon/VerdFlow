[project]
name = "verdflow-studio-service"
version = "0.1.0"
description = "Optional read projections and caches for the VerdFlow Studio UI."
requires-python = ">=3.11"
dependencies = ["verdflow-contracts", "verdflow-project-store"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]
