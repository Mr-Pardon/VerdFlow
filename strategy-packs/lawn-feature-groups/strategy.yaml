schema: verdflow.strategy
version: '2'
strategy_id: lawn_feature_groups
strategy_version: 1.0.2
display_name: 草坪点景组团
description: >-
  使用细粒度边缘草坪和带扰动的主体草坪连续覆盖区域，并在安全内部空间布置少量由
  可选主景植物、环绕灌木和外缘点缀植物组成的完整复合组团。
generator:
  id: lawn_feature_groups
  version: '1'
  entry: generator.py:generate
roles:
  - role_key: lawn_groundcover
    display_name: 主体草坪
    description: 连续覆盖区域内部，形成点景组团下方的草坪底面。
    required: true
    assignment_policy: weighted_pool
  - role_key: edge_groundcover
    display_name: 收边草坪
    description: 以更密的小尺度草坪补齐边缘，衔接主体草坪与区域边界。
    required: true
    assignment_policy: weighted_pool
  - role_key: feature_anchor
    display_name: 中心主景
    description: 位于点景组团中央，形成高于周边植被的视觉重点。
    required: true
    assignment_policy: weighted_pool
  - role_key: surrounding_shrub
    display_name: 组团灌木
    description: 围绕中心主景形成体量；算法生成无主景组团时，会向中心收拢。
    required: true
    assignment_policy: weighted_pool
  - role_key: outer_accent
    display_name: 外围点缀
    description: 落在组团外围的空隙中，以较小植被柔化边缘。
    required: true
    assignment_policy: weighted_pool
intent:
  summary: 连续草坪上稀疏分布、主次清晰且略有变化的复合点景组团。
  design_keywords:
    - 双层连续草坪
    - 受限自然扰动
    - 内部点景
    - 可选单株主景
    - 环绕灌木
    - 稳定模板微变
  avoid:
    - 点景组团贴近边界
    - 全随机环形散点
    - 草坪覆盖节奏破碎
    - 每个组团完全相同
terrain_suitability:
  feature_scope: single_region
  selection_hint: >-
    用于以草坪为主体、需要少量复合植物组团点景的面状绿地；过窄区域会自动退化为纯草坪。
