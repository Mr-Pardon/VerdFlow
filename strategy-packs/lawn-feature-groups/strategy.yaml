      - {role_key: outer_accent, kind: groundcover, x: 41, y: 49, size: 8}
parameters:
  default_seed: 17
generation_parameters:
  - key: groundcover_spacing_m
    visible_for_roles: [lawn_groundcover]
    value_type: number
    default: 1.2
    min: 0.5
    max: 4.0
    step: 0.1
    group: quick
    display_name: 主体草坪间距
    effect: 调小会增加主体草坪点位并形成更连续的覆盖，调大可降低点位数量并增强单株辨识度；边缘草坪始终使用固定的小间距。
  - key: feature_group_density
    visible_for_roles: [feature_anchor, surrounding_shrub, outer_accent]
    value_type: number
    default: 3.0
    min: 0.0
    max: 4.0
    step: 0.1
    group: quick
    display_name: 点景组团密度
    effect: 调高会在区域内部增加点景组团，调低会保留更完整的草坪主体；设为零时仅铺设草坪。
  - key: feature_anchor_probability
    visible_for_roles: [feature_anchor, surrounding_shrub, outer_accent]
    value_type: number
    default: 0.75
    min: 0.0
    max: 1.0
    step: 0.05
    group: quick
    display_name: 主景植物出现概率
    effect: 调高会让更多组团包含中央高大植物，调低会增加低矮点景；同时影响周边灌木与点缀的环绕尺度。
  - key: feature_group_min_count
    visible_for_roles: [feature_anchor, surrounding_shrub, outer_accent]
    value_type: number
    default: 0
    min: 0
    max: 50
    step: 1
    group: advanced
    display_name: 最少点景组数
    effect: 按每个独立区域设置点景组团的数量下限；设为零时不约束，过窄区域仍会优先保证可容纳性。
  - key: feature_group_max_count
    visible_for_roles: [feature_anchor, surrounding_shrub, outer_accent]
    value_type: number
    default: 0
    min: 0
    max: 50
    step: 1
    group: advanced
    display_name: 最多点景组数
    effect: 按每个独立区域限制点景组团的数量上限；设为零时不约束。
