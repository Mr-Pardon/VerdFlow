[project]
name = "verdflow-dts-adapter"
version = "0.1.0"
description = "DTS ModelPoint XML output adapter for VerdFlow."
requires-python = ">=3.11"
dependencies = [
  "verdflow-contracts",
  "verdflow-core",
  "verdflow-planting",
  "verdflow-project-store",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]
