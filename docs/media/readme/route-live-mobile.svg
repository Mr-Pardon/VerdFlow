<svg xmlns="http://www.w3.org/2000/svg" width="400" height="366" viewBox="0 0 400 366" role="img" aria-labelledby="title desc"><title id="title">在 DTS 中直接种植</title><desc id="desc">绘制选区或导入 SHP，让种植结果直接回到已经打开的 DTS 场景。 绘制多个选区；选择策略与植被搭配；采样并回写场景。查看操作指南。</desc><rect x="0.5" y="0.5" width="399" height="365" rx="6" fill="#fff" stroke="#dce5de"></rect><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" letter-spacing="0"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#38816c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" x="24" y="24" class="lucide lucide-mouse-pointer2-icon lucide-mouse-pointer-2"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"></path></svg><text x="376" y="44" fill="#a0ada2" font-size="14" font-weight="400" text-anchor="end">01</text><text x="24" y="88" fill="#6e8275" font-size="13" font-weight="600" text-anchor="start">DTS EXPLORER</text><text x="24" y="124" fill="#243d31" font-size="25" font-weight="600" text-anchor="start">在 DTS 中直接种植</text><text x="24" y="160" fill="#768279" font-size="17" font-weight="400" text-anchor="start">绘制选区或导入 SHP，让种植结果</text><text x="24" y="185" fill="#768279" font-size="17" font-weight="400" text-anchor="start">直接回到已经打开的 DTS 场景。</text><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#567365" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" x="24" y="209" class="lucide lucide-check-icon lucide-check"><path d="M20 6 9 17l-5-5"></path></svg><text x="51" y="222" fill="#567365" font-size="17" font-weight="400" text-anchor="start">绘制多个选区</text><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#567365" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" x="24" y="237" class="lucide lucide-check-icon lucide-check"><path d="M20 6 9 17l-5-5"></path></svg><text x="51" y="250" fill="#567365" font-size="17" font-weight="400" text-anchor="start">选择策略与植被搭配</text><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#567365" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" x="24" y="265" class="lucide lucide-check-icon lucide-check"><path d="M20 6 9 17l-5-5"></path></svg><text x="51" y="278" fill="#567365" font-size="17" font-weight="400" text-anchor="start">采样并回写场景</text><line x1="24" y1="308" x2="376" y2="308" stroke="#e7ede6"></line><text x="24" y="340" fill="#245d47" font-size="17" font-weight="400" text-anchor="start">查看操作指南</text><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#245d47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" x="355" y="324" class="lucide lucide-arrow-up-right-icon lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></g></svg>
