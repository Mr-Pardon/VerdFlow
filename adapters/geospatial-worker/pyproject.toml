[project]
name = "verdflow-geospatial-worker"
version = "0.1.0"
description = "Supervised polygon source and GeoTIFF elevation adapter for VerdFlow."
requires-python = ">=3.11"
dependencies = [
  "pyshp>=2.3",
  "rasterio>=1.4",
  "shapely>=2.0",
  "verdflow-contracts",
  "verdflow-core",
  "verdflow-project-store",
  "verdflow-worker-runtime",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdflow"]
